name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install flask psutil
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Shell quoting tests (JavaScript)
        run: node tests/shell_quote.test.js
      - name: Launcher syntax (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash -n start_server.sh
